[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sad-hamster-bot"
version = "0.1.0"
description = "A private Discord bridge to the Codex CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["discord.py>=2.5,<3", "python-dotenv>=1.2,<2"]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
sad-hamster-bot = "sad_hamster_bot:main"

[tool.setuptools]
py-modules = ["sad_hamster_bot", "models", "bot_settings", "codex_runner", "job_manager", "job_store", "runtime_lock"]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
